name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  # thatteOS is written in ManiT, so a compiler change can break it without
  # anything in this repository changing. Rebuild weekly against manitc main.
  schedule:
    - cron: '17 4 * * 1'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build + test
    runs-on: ubuntu-latest
    env:
      # build.sh defaults to clang-19; runners carry an unversioned clang.
      CLANG: clang
    steps:
      # The two repositories are checked out as siblings, which is the layout
      # build.sh expects (MANITC defaults to ../manitc/target/release/manitc).
      - uses: actions/checkout@v4
        with:
          path: thatteos

      - uses: actions/checkout@v4
        with:
          repository: manishthatte/manitc
          path: manitc

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libcurl4-openssl-dev libsdl2-dev libsdl2-ttf-dev

      - name: Build the ManiT compiler
        working-directory: manitc
        run: cargo build --release --locked

      # build.sh now builds the KERNEL as well as the shell — 26 modules
      # merged from src/kernel.manifest, for both backends. Until 30 August
      # 2026 nothing here compiled src/ at all, and two modules had stopped
      # compiling without anyone being told.
      - name: Build the kernel and the shell
        working-directory: thatteos
        run: bash build.sh

      - name: Build userspace programs
        working-directory: thatteos
        run: bash userspace/build.sh

      - name: Regression tests
        working-directory: thatteos
        run: bash tests/test_all.sh

      # ENHANCEMENT_PLAN.md §5.1: `--verify-ssa` over every .mt in this
      # repository. It is what found report.txt P37 — five thatteOS files
      # computing a wrong answer that 638 maniTC tests and a 17/17 parity
      # matrix had all passed — and it was never run here.
      - name: Verify SSA over every module
        working-directory: thatteos
        run: |
          set -e
          MANITC=../manitc/target/release/manitc
          fail=0
          for f in build/kernel.mt build/kernel_demos.mt thatteos.mt userspace/*.mt tests/*.mt; do
            out=$("$MANITC" compile --target llvm --verify-ssa "$f" -o /dev/null 2>&1 || true)
            bad=$(printf '%s' "$out" | grep -oE '[0-9]+ violations' | grep -voE '^0 ' || true)
            if [ -n "$bad" ]; then
              echo "SSA violations in $f:"
              printf '%s\n' "$out" | grep -E 'violations|not in SSA'
              fail=1
            fi
          done
          exit $fail
